<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لهب متحرك على النص</title>
<style>
  body {
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .flame-text {
    font-family: 'Audiowide', cursive;
    font-size: 6rem;
    color: #ff4500;
    position: relative;
    text-transform: uppercase;
    animation: flicker 1.8s infinite alternate;
    user-select: none;
  }

  /* ظلال ووهج يشبه اللهب */
  .flame-text::before {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    color: #ffae42;
    filter: blur(5px);
    opacity: 0.7;
    z-index: -2;
    animation: flame-flicker 1.6s infinite alternate;
  }

  .flame-text::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    color: #ffb347;
    filter: blur(8px);
    opacity: 0.5;
    z-index: -3;
    animation: flame-flicker-alt 1.4s infinite alternate;
  }

  @keyframes flicker {
    0%, 100% {
      color: #ff4500;
      text-shadow:
        0 0 10px #ff4500,
        0 0 20px #ff6e00,
        0 0 30px #ff8c00,
        0 0 40px #ff9c00,
        0 0 50px #ffae00;
      transform: scale(1) translateY(0);
    }
    50% {
      color: #ff5e00;
      text-shadow:
        0 0 15px #ff5e00,
        0 0 25px #ff7e00,
        0 0 35px #ff9e00,
        0 0 45px #ffae00,
        0 0 55px #ffbf00;
      transform: scale(1.05) translateY(-3px);
    }
  }

  @keyframes flame-flicker {
    0%, 100% {
      opacity: 0.7;
      filter: blur(5px);
      transform: translateX(0) translateY(0);
    }
    50% {
      opacity: 0.9;
      filter: blur(3px);
      transform: translateX(2px) translateY(-2px);
    }
  }

  @keyframes flame-flicker-alt {
    0%, 100% {
      opacity: 0.5;
      filter: blur(8px);
      transform: translateX(0) translateY(0);
    }
    50% {
      opacity: 0.7;
      filter: blur(6px);
      transform: translateX(-2px) translateY(1px);
    }
  }
</style>
</head>
<body>
  <div class="flame-text" data-text="Soon">Soon</div>
</body>
</html>
