<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEDxYouth STEM Oct 11th District</title>
  <link rel="icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/7fdd346d74.js" crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Lato', sans-serif;
      background-color: #000;
      color: #fff;
      scroll-behavior: smooth;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 10;
      flex-wrap: wrap;
    }

    header img {
      height: 60px;
    }

    .menu-toggle {
      display: none;
      font-size: 26px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 1rem;
      font-size: 15px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #cd1e1e;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5rem 1rem 3rem;
      min-height: 85vh;
    }

    #headline {
      font-size: 3rem;
      font-weight: bold;
      margin: 0;
    }

    .hero-text {
      max-width: 700px;
      font-size: 1.1rem;
      color: #ddd;
      line-height: 1.6;
      margin-top: 1rem;
    }

    .book-btn {
      margin-top: 2rem;
      background: linear-gradient(135deg, #cd1e1e, #8f0707);
      color: white;
      font-weight: bold;
      border-radius: 100px;
      padding: 0.9rem 1.9rem;
      font-size: 1.1rem;
      border: 2px solid transparent;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      display: inline-block;
      min-width: 160px;
      transition: all 0.3s ease;
    }

    .book-btn span {
      position: relative;
      z-index: 2;
    }

    .book-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(25deg);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .book-btn:hover::before {
      opacity: 1;
      animation: shine 1s ease forwards;
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%) rotate(25deg);
      }
      100% {
        transform: translateX(100%) rotate(25deg);
      }
    }

    .counter {
      display: flex;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .counter-item {
      text-align: center;
      font-size: 1.5rem;
    }
    .counter-item span {
      display: block;
      font-size: 2.5rem;
      font-weight: bold;
      color: #ff4a4a;
    }
    .counter-item small {
      display: block;
      font-size: 0.8rem;
      color: #ddd;
    }

    .nexula-section {
      padding: 4rem 1rem;
      text-align: center;
    }

    .nexula-section h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .nexula-section p {
      font-size: 1.2rem;
      color: #ccc;
      max-width: 900px;
      margin: 0 auto 1.5rem;
    }

    .nexula-image-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }

    .nexula-image-grid img {
      width: 300px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    footer {
      background-color: #000;
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.9rem;
    }

    footer p {
      margin: 0 0 1rem;
    }

    footer .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    footer a {
      color: #ccc;
      text-decoration: none;
      transition: color 0.3s;
    }

    footer a:hover {
      color: #ff0000;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .social-icons a {
      font-size: 1.3rem;
      color: #ccc;
    }

    .social-icons a:hover {
      color: #ff0000;
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        text-align: center;
        position: absolute;
        top: 100%;
        left: 0;
      }
      nav.show {
        display: flex;
      }
      nav a {
        margin: 1rem 0;
      }
      .hero {
        padding: 4rem 1rem;
      }
      #headline {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <header>
    <img src="logo_nav.png" alt="TEDx Logo">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav id="main-nav">
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#event">Event</a>
      <a href="#tickets">Tickets</a>
      <a href="#tedx">What is TEDx</a>
    </nav>
  </header>
  <div class="hero">
    <h1 id="headline">Welcome to <span style="color:#cd1e1e;">NEXULA</span></h1>
    <p class="hero-text">A cosmic space where minds meet, stars are born, and the future begins.</p>
    <a href="#tickets" class="book-btn"><span>Book Tickets!</span></a>
    <div class="counter" id="counter">
      <span class="counter-item"><span id="days">0</span><small>DAYS</small></span>
      <span class="counter-item"><span id="hours">0</span><small>HRS</small></span>
      <span class="counter-item"><span id="minutes">0</span><small>MINS</small></span>
      <span class="counter-item"><span id="seconds">0</span><small>SECS</small></span>
    </div>
  </div>
  <!-- باقي المحتوى كما هو -->
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 100 },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.4 },
        size: { value: 2 },
        line_linked: { enable: true, color: "#cd1e1e", opacity: 0.4 },
        move: { enable: true, speed: 1 }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onclick: { enable: true, mode: "push" } },
        modes: { push: { particles_nb: 4 } }
      },
      retina_detect: true
    });

    function toggleMenu() {
      document.getElementById('main-nav').classList.toggle('show');
    }

    const startDate = new Date("August 5, 2025 12:00:00").getTime();
    const daysEl = document.getElementById("days"),
          hoursEl = document.getElementById("hours"),
          minutesEl = document.getElementById("minutes"),
          secondsEl = document.getElementById("seconds");

    function updateCounter() {
      const now = Date.now();
      const diff = now - startDate;
      if (diff < 0) return;
      const sec = Math.floor(diff / 1000);
      const days = Math.floor(sec / (24*3600));
      const hrs = Math.floor((sec % (24*3600)) / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = sec % 60;
      daysEl.textContent = days;
      hoursEl.textContent = hrs;
      minutesEl.textContent = mins;
      secondsEl.textContent = secs;
    }

    setInterval(updateCounter, 1000);
    updateCounter();
  </script>
</body>
</html>
