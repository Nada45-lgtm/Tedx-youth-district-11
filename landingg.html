<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEDx Landing Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }
    header {
      background-color: #000000;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff2b06; /* TEDx Red */
    }
    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    .hero {
      background-color: #f5f5f5;
      text-align: center;
      padding: 100px 20px;
    }
    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .cta-button {
      padding: 15px 30px;
      background-color: #ff2b06;
      color: white;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    footer {
      background-color: #000000;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">TEDxProject</div>
    <nav>
      <a href="#about">About</a>
      <a href="#speakers">Speakers</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to TEDx</h1>
    <p>Ideas worth spreading. Join the revolution of minds.</p>
    <button class="cta-button">Get Involved</button>
  </section>

  <footer>
    <p>&copy; 2025 TEDxProject. All rights reserved.</p>
  </footer>

</body>
</html>
