<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
  <link rel="icon" href="icon.png">
  <script src="https://kit.fontawesome.com/7fdd346d74.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; padding: 0; }
    canvas { display: block; }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: -1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: rgba(0, 0, 0, 0.85);
      font-family: 'Audiowide', sans-serif;
    }

    header img {
      height: 65px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 1rem;
      transition: color 0.3s;
      font-size: 15px;
    }

    nav a.active:hover {
      color: #a71212;
    }

    .book-btn {
      background: linear-gradient(135deg, #ff0000, #ff0000);
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      box-shadow: 0 0 8px #ff0000;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .book-btn:hover {
      background: black;
      color: white;
      border-color: #8b0606;
      box-shadow: 0 0 15px #ff0000;
    }

    .hero {
      position: relative;
      top: 20vh;
      text-align: center;
      color: white;
      font-family: 'Audiowide', sans-serif;
      z-index: 2;
      padding: 0 20px;
    }

    .fire-text {
      font-size: 5rem;
      color: #ff0000;
      text-shadow: 
        0 0 5px #ff0000, 
        0 0 10px #ff0000, 
        0 0 20px #ff4d4d, 
        0 0 30px #ff1a1a, 
        0 0 40px #ff0000;
      animation: flicker 1.5s infinite alternate, shake 0.4s infinite;
    }

    @keyframes flicker {
      0% { opacity: 1; text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #ff4d4d; }
      50% { opacity: 0.8; text-shadow: 0 0 10px #ff4d4d, 0 0 20px #ff1a1a; }
      100% { opacity: 1; text-shadow: 0 0 5px #ff0000, 0 0 30px #ff1a1a; }
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    footer a {
      color: #ccc;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #dddddd;
    }
  </style>
</head>

<body>
  <div id="particles-js"></div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="https://threejs.org/examples/js/libs/stats.min.js"></script>

  <header>
    <img src="logo_nav.png" alt="TEDx Logo">
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="Aboutus" class="active">About Us</a>
      <a href="Articles.html">Articles</a>
      <a href="tickets.html">Our Event</a>
      <a href="signup.html">Book a Ticket</a>
    </nav>
  </header>

  <div class="hero">
    <main>
      <h1 class="fire-text">SOON</h1>
    </main>
  </div>

  <footer>
  <p>&copy; 2025 TEDxYouth@October11th. All rights reserved. |
    <a href="privacy-policy.html">Privacy Policy</a> |
    <a href="terms-of-use.html">Terms of Use</a>
  </p>
  <div class="social-icons">
  <a href="https://www.instagram.com/tedxyouthoctobe11stem" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/201055485256" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="mailto:tedxoct11@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
      <a href="https://www.tiktok.com/@tedxyouthoctobe11stem" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://www.facebook.com/TEDxYouthOctober11thSTEM" target="_blank"><i class="fab fa-facebook"></i></a>
  </div>
</footer>

  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 150, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#ffffff" },
        "shape": {
          "type": "circle",
          "stroke": { "width": 0, "color": "#000000" },
          "polygon": { "nb_sides": 5 }
        },
        "opacity": { "value": 0.5 },
        "size": { "value": 3, "random": true },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#ff0000",
          "opacity": 0.4,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 6,
          "direction": "none",
          "out_mode": "out"
        }
      },
      "interactivity": {
        "events": {
          "onhover": { "enable": false, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" }
        },
        "modes": {
          "push": { "particles_nb": 4 }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
